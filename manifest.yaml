# The Jira plugin's manifest, read by the host before any of its code runs.
name: jira
title: Jira Sync
description: Pull a Jira Cloud board's issues into the Backlog as tasks, and their comments as threads signed by the people who wrote them; sync a task's changes back, or make an issue from a task, one at a time when you ask
version: 0.4.0
min_host: 0.21.0
requires:
  - backlog
  - comments
settings:
  - name: connections
    type: structured
    scope: root
    default: []
    meaning: 'the boards this root connects to: each a name, site, project, optional board and jql, a direction, and its mapping'
  - name: pull_attachments
    type: checkbox
    scope: root
    default: false
    meaning: download each pulled issue's attachments into an asset folder the Assets plugin manages instead of linking to them in Jira
  - name: attachments_folder
    type: text
    scope: root
    default: ''
    meaning: the asset folder downloaded attachments go to, one the Assets plugin manages; empty, its first folder
  - name: add_people
    type: checkbox
    scope: root
    default: false
    meaning: add each person a pull finds whom the root does not have (an assignee, a comment's author, a person mentioned) to the root's users; off, they keep the name Jira gives them
  - name: own_board
    type: checkbox
    scope: root
    default: false
    meaning: a connection made from now on pulls onto a Backlog board of its own, named for its Jira board, keeping its workflow instead of mapping it onto another board's; off, it pulls onto the backlog's first board
  - name: board_folders
    type: checkbox
    scope: root
    default: false
    meaning: a Backlog board made for a connection keeps its tasks in a folder of its own under the backlog's, named for the board
  - name: accounts
    type: structured
    scope: me
    default: {}
    meaning: the Atlassian email each site signs in with, for this root (the token is in the credentials file in app data)
  - name: auto_fetch
    type: select
    scope: me
    default: 'off'
    options: ['off', '5', '15', '30', '60']
    meaning: fetch every pull connection this many minutes apart while the app has the root open; nothing pulls on its own
  - name: auto_sync_on_save
    type: checkbox
    scope: me
    default: false
    meaning: sync a task that holds an issue a few seconds after its last save, while the app has the root open; anything to settle waits in Needs you
  - name: auto_sync_on_push
    type: checkbox
    scope: me
    default: false
    meaning: sync every task edited here once the app pushes (an auto save's publish, Publish); anything to settle waits in Needs you
